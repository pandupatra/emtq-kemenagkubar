'use strict';
const $=id=>document.getElementById(id);
const escapeHTML=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc=escapeHTML;
const KEY='maqro-flow-v2';
const districts=['Melak','Barong Tongkok','Sekolaq Darat','Long Iram'];
const branches=['Tilawah · Dewasa','Tilawah · Remaja','Tartil · Anak-anak'];
const blankState=()=>({people:[{id:'101',name:'Ahmad Fauzan',d:'Melak',gender:'Putra',birth:'2003-05-12',entries:[0,1],status:'Terverifikasi',note:''},{id:'102',name:'Siti Aisyah',d:'Melak',gender:'Putri',birth:'2005-03-20',entries:[0],status:'Draf',note:''},{id:'201',name:'Abdul Rahman',d:'Barong Tongkok',gender:'Putra',birth:'2001-08-10',entries:[0],status:'Diajukan',note:''},{id:'301',name:'Annisa Putri',d:'Sekolaq Darat',gender:'Putri',birth:'2007-06-18',entries:[1],status:'Perlu perbaikan',note:'Periksa kembali tanggal lahir.'},{id:'401',name:'Ali Akbar',d:'Long Iram',gender:'Putra',birth:'2015-01-06',entries:[2],status:'Terverifikasi',note:''}],sessions:branches.map((_,i)=>({branch:i,round:'Penyisihan',open:i===0,repeat:true})),bank:branches.flatMap((_,i)=>[['Al-Baqarah','21–25'],['Ali Imran','190–194'],['Luqman','12–19']].map((m,j)=>({id:`M${i+1}-0${j+1}`,branch:i,surah:m[0],verses:m[1]}))),results:[],accounts:districts.map(d=>({d,user:d.toLowerCase().replaceAll(' ','-'),active:true,password:'demo123'})),logs:[],adminPassword:'demo123'});
let db,readError='';
try{const raw=localStorage.getItem(KEY);db=raw?JSON.parse(raw):blankState();if(!Array.isArray(db.people)||!Array.isArray(db.sessions)||!Array.isArray(db.bank)||!Array.isArray(db.results)||!Array.isArray(db.accounts)||!Array.isArray(db.logs))throw Error('invalid');db.adminPassword||='demo123';}catch{db=blankState();readError='Data demo tersimpan tidak dapat dibaca. Contoh awal dimuat sementara; periksa izin penyimpanan browser sebelum menyimpan.';}
let role=null,district='',page='dashboard',loginRole='admin',search='',statusFilter='',menuOpen=false,drawStep=1,drawSelection=null,drawResult=null,busy=false,focusReturn=null,saveFailure='',pendingTransaction=null,feedbackTimer;

const button=(text,handler,kind='',extra='')=>`<button type="button" class="btn ${kind}" onclick="${handler}" ${extra}>${text}</button>`;

const badge=status=>`<span class="status ${['Draf','Diajukan','Perlu perbaikan','Menunggu sesi'].includes(status)?'warn':status==='Dibatalkan'?'bad':''}">${esc(status)}</span>`;

function transaction(change,message){const candidate=structuredClone(db);change(candidate);candidate.logs.unshift({t:message,time:new Date().toLocaleString('id-ID',{timeZone:'Asia/Makassar'})});try{localStorage.setItem(KEY,JSON.stringify(candidate));db=candidate;pendingTransaction=null;saveFailure='';return true;}catch{saveFailure='Perubahan belum tersimpan. Browser menolak penyimpanan data. Periksa izin atau ruang penyimpanan lalu coba lagi.';pendingTransaction=()=>transaction(change,message);showSaveError();return false;}}
function showSaveError(){const target=$('dialog').open?$('dialog-error'):$('save-error');if(target)target.innerHTML=`<div class="error" role="alert">${saveFailure}<div class="actions" style="margin-top:10px">${button('Coba simpan lagi','retrySave()')}</div></div>`;else notify(saveFailure);}
function retrySave(){if(pendingTransaction&&pendingTransaction()){closeDialog();render();notify('Perubahan berhasil disimpan.');}}

function login(){role=null;page='dashboard';menuOpen=false;$('app').innerHTML=`<div class="login"><section class="login-context"><div class="wordmark">maqro<span>Ruang panitia MTQ</span></div><h1>Setiap kafilah.<br>Satu proses yang tertib.</h1><p>Pendaftaran peserta, verifikasi panitia, dan undian maqro dalam satu ruang kerja.</p><div class="event-stamp">MTQ Kabupaten Kutai Barat<br><small style="color:inherit">Contoh penyelenggaraan 2026</small></div></section><main class="login-main" id="workspace"><div class="login-box"><h1>Masuk ke ruang kerja</h1><p>Pilih akses yang akan digunakan.</p><div class="role-tabs" role="tablist" aria-label="Role demo">${button('Admin utama',"setLoginRole('admin')",'','role="tab" aria-selected="'+(loginRole==='admin')+'"')}${button('Akun kecamatan',"setLoginRole('district')",'','role="tab" aria-selected="'+(loginRole==='district')+'"')}</div><form id="login-form" onsubmit="doLogin(event)" class="form-stack">${loginRole==='district'?`<div><label for="login-district">Kecamatan</label><select id="login-district" onchange="fillLoginUser()">${districts.map(d=>option(d,d)).join('')}</select></div>`:''}<div><label for="login-user">Nama pengguna</label><input id="login-user" autocomplete="username" value="${loginRole==='admin'?'admin':'melak'}" required></div><div><label for="login-pass">Kata sandi</label><input id="login-pass" type="password" autocomplete="current-password" value="demo123" required></div><div id="login-error" role="alert"></div><button class="btn primary" type="submit">Masuk</button></form>${readError?`<div class="error">${readError}</div>`:''}<div class="login-demo"><strong>Akun demonstrasi</strong><br>${loginRole==='admin'?'Username <code>admin</code>':'Username sesuai kecamatan, misalnya <code>melak</code>'} · kata sandi awal <code>demo123</code>.<p style="margin:10px 0 0">Data contoh. Login dan akses role disimulasikan di browser perangkat ini.</p></div><div style="margin-top:16px">${button(theme==='dark'?'Tema terang':'Tema gelap','setTheme()','quiet','id="theme-toggle"')}</div></div></main></div>`;}
function setLoginRole(value){loginRole=value;login();}
function fillLoginUser(){$('login-user').value=$('login-district').value.toLowerCase().replaceAll(' ','-');}
function doLogin(event){event.preventDefault();const user=$('login-user').value.trim(),pass=$('login-pass').value;const account=loginRole==='district'?db.accounts.find(a=>a.d===$('login-district').value&&a.user===user&&a.password===pass&&a.active):null;const allowed=loginRole==='admin'?user==='admin'&&pass===db.adminPassword:!!account;if(!allowed){$('login-error').innerHTML='<div class="error">Tidak dapat masuk. Periksa nama pengguna dan kata sandi; akun kecamatan juga harus berstatus aktif.</div>';return;}role=loginRole;district=account?.d||'';page='dashboard';drawStep=1;render();}
const titles={dashboard:'Ringkasan kerja',people:'Peserta & pendaftaran',accounts:'Akun kecamatan',sessions:'Cabang & sesi',bank:'Bank maqro',draw:'Undian maqro',results:'Hasil undian',logs:'Catatan aktivitas'};
const descriptions={dashboard:'',people:'Periksa status dan tindak lanjuti pendaftaran peserta.',accounts:'Satu kecamatan memiliki satu akun pengelola kafilah.',sessions:'Atur babak, ketentuan paket, dan akses undian setiap cabang.',bank:'Paket contoh dikelompokkan menurut cabang perlombaan.',draw:'Pastikan identitas peserta sebelum menetapkan maqro.',results:'Bukti undian yang tersimpan, termasuk hasil yang dibatalkan.',logs:'Perubahan data dan keputusan panitia yang tercatat di perangkat ini.'};
function allowedPages(){return role==='admin'?['dashboard','people','sessions','bank','accounts','results','logs']:['dashboard','people','draw','results'];}
function go(next){if(busy||!allowedPages().includes(next))return;page=next;menuOpen=false;search='';statusFilter='';if(next==='draw'){drawStep=1;drawSelection=null;drawResult=null;}render();$('workspace').focus();}
function render(){if(!role)return login();if(!allowedPages().includes(page))page='dashboard';const nav=allowedPages();$('app').innerHTML=`<div class="shell"><aside class="side ${menuOpen?'is-open':''}" id="side"><div class="wordmark">maqro<span>Ruang panitia MTQ</span></div>${button(menuOpen?'Tutup menu':'Menu','toggleMenu()','mobile-toggle','id="menu-toggle" aria-controls="navigation" aria-expanded="'+menuOpen+'"')}<nav id="navigation" aria-label="Navigasi utama">${nav.map(p=>`<button type="button" class="nav-link" onclick="go('${p}')" ${page===p?'aria-current="page"':''}>${titles[p]}</button>`).join('')}</nav><div class="side-foot"><p>${role==='admin'?'Admin utama':'Kafilah '+esc(district)}<br>MTQ Kabupaten Kutai Barat</p><div class="actions">${button('Pengaturan akun','accountDialog()')}${button('Keluar','logout()','quiet')}</div></div></aside><main class="main"><header class="topbar"><span>MTQ Kutai Barat · 2026</span>${button(role==='admin'?'Admin utama':'Kafilah '+esc(district),'accountDialog()','account-trigger')}</header><div class="demo-strip">Prototipe interaktif · Data peserta dan maqro adalah contoh</div><div class="workspace" id="workspace" tabindex="-1"><div class="page-head"><div><div class="overline">${role==='admin'?'Panitia kabupaten':'Kecamatan '+esc(district)}</div><h1>${titles[page]}</h1>${descriptions[page]?`<p>${descriptions[page]}</p>`:''}</div>${page==='people'&&role==='district'?button('Tambah peserta','personForm()','primary'):page==='bank'?button('Tambah paket','maqroForm()','primary'):''}</div><div id="save-error"></div><div id="view"></div><p class="draft-note">Mockup untuk peninjauan alur. Penyimpanan berada pada browser ini, belum terhubung ke database.</p></div></main></div>`;({dashboard,people:peoplePage,accounts:accountsPage,sessions:sessionsPage,bank:bankPage,draw:drawPage,results:resultsPage,logs:logsPage}[page])();if(saveFailure)showSaveError();}
function toggleMenu(){menuOpen=!menuOpen;$('side').classList.toggle('is-open',menuOpen);$('menu-toggle').setAttribute('aria-expanded',menuOpen);$('menu-toggle').textContent=menuOpen?'Tutup menu':'Menu';}
function logout(){if(busy)return;closeDialog();login();}
function visiblePeople(){return db.people.filter(p=>role==='admin'||p.d===district);}
function visibleResults(){return db.results.filter(r=>role==='admin'||r.d===district);}
function personById(id){return visiblePeople().find(p=>p.id===id);}
function resultFor(pid,branch,round){return db.results.find(r=>r.pid===pid&&r.branch===branch&&r.round===round&&!r.cancelled);}
function personActions(p){if(role==='admin')return p.status==='Diajukan'?button('Periksa',`personDetail('${p.id}')`,'primary'):button('Lihat detail',`personDetail('${p.id}')`);return ['Draf','Perlu perbaikan'].includes(p.status)?button('Lengkapi data',`personForm('${p.id}')`)+button('Ajukan verifikasi',`submitPerson('${p.id}')`,'primary'):button('Lihat detail',`personDetail('${p.id}')`);}
function dashboard(){const ps=visiblePeople(),rs=visibleResults().filter(r=>!r.cancelled);const todo=ps.filter(p=>role==='admin'?p.status==='Diajukan':['Draf','Perlu perbaikan'].includes(p.status));const title=role==='admin'?'Pendaftaran perlu diperiksa':'Peserta perlu ditindaklanjuti';$('view').innerHTML=`<div class="summary-line"><span><strong>${ps.length}</strong>peserta contoh</span><span><strong>${ps.filter(p=>p.status==='Terverifikasi').length}</strong>terverifikasi</span><span><strong>${rs.length}</strong>hasil undian aktif</span></div><div class="split"><section class="panel"><div class="section-head"><div><h2>${title}</h2><p class="hint">${role==='admin'?'Verifikasi agar peserta dapat melanjutkan ke undian.':'Data yang sudah diajukan akan diperiksa admin utama.'}</p></div>${badge(todo.length+' peserta')}</div>${todo.length?`<ul class="work-list">${todo.map(p=>`<li class="work-item"><div class="identity"><span class="number">${esc(p.id.length>7?p.id.slice(-4):p.id)}</span><div><h3>${esc(p.name)}</h3><p>${esc(p.d)} · ${p.entries.map(b=>esc(branches[b])).join(', ')}</p>${badge(p.status)}${p.note?`<p>${esc(p.note)}</p>`:''}</div></div><div class="actions">${personActions(p)}</div></li>`).join('')}</ul>`:empty('Antrean sudah selesai',role==='admin'?'Tidak ada pengajuan yang menunggu pemeriksaan. Periksa sesi untuk mempersiapkan undian.':'Semua data telah diajukan atau diverifikasi. Buka ruang undian untuk memeriksa kesiapan peserta.',button(role==='admin'?'Periksa sesi':'Buka ruang undian',`go('${role==='admin'?'sessions':'draw'}')`,'primary'))}</section><div class="stack"><section class="panel"><div class="section-head"><h2>Status sesi</h2></div><ul class="work-list">${db.sessions.map(s=>`<li class="work-item"><div><h3>${esc(branches[s.branch])}</h3><p>${s.round}</p>${badge(s.open?'Dibuka':'Menunggu sesi')}</div></li>`).join('')}</ul><div style="margin-top:20px">${button(role==='admin'?'Kelola sesi':'Pilih peserta undian',`go('${role==='admin'?'sessions':'draw'}')`,'primary')}</div></section><section class="panel"><h2>${role==='admin'?'Urutan persiapan':'Alur kafilah'}</h2><p class="hint">${role==='admin'?'Periksa peserta → pastikan paket tersedia → buka sesi → pantau hasil.':'Lengkapi peserta → ajukan verifikasi → ikuti sesi undian → simpan bukti.'}</p></section></div></div>`;}
function peoplePage(){$('view').innerHTML=`<div class="filters"><div class="field"><label for="people-search">Cari peserta atau kecamatan</label><input id="people-search" type="search" placeholder="Nama peserta atau kecamatan" oninput="search=this.value;renderPeopleRows()"></div><div class="field"><label for="people-status">Status pendaftaran</label><select id="people-status" onchange="statusFilter=this.value;renderPeopleRows()">${option('','Semua status')}${['Draf','Diajukan','Perlu perbaikan','Terverifikasi'].map(s=>option(s,s)).join('')}</select></div></div><section class="panel data-panel"><div id="people-data"></div></section>`;renderPeopleRows();}
function renderPeopleRows(){const rows=visiblePeople().filter(p=>(p.name+' '+p.d).toLowerCase().includes(search.toLowerCase())&&(!statusFilter||p.status===statusFilter));$('people-data').innerHTML=rows.length?`<table class="table"><thead><tr><th>Peserta</th><th>Status</th><th>Kecamatan & cabang</th><th>Tindakan</th></tr></thead><tbody>${rows.map(p=>`<tr><td data-label="Peserta"><div><strong>${esc(p.name)}</strong><small>No. ${esc(p.id)} · ${p.gender}</small></div></td><td data-label="Status"><div>${badge(p.status)}${p.note?`<small>${esc(p.note)}</small>`:''}</div></td><td data-label="Cabang"><div>${esc(p.d)}<small>${p.entries.map(i=>esc(branches[i])).join('<br>')}</small></div></td><td data-label="Tindakan"><div class="actions">${personActions(p)}</div></td></tr>`).join('')}</tbody></table>`:`<div style="padding:20px">${empty('Peserta tidak ditemukan',search||statusFilter?'Ubah kata pencarian atau status untuk melihat peserta lain.':'Tambahkan peserta kafilah sebelum mengajukan verifikasi.',role==='district'?button('Tambah peserta','personForm()','primary'):'')}</div>`;}
function personForm(id){if(role!=='district')return;const p=id?personById(id):null;if(p&&!['Draf','Perlu perbaikan'].includes(p.status))return;openDialog(p?'Lengkapi data peserta':'Tambah peserta',`<form class="form-stack" onsubmit="savePerson(event,'${id||''}')"><div><label for="person-name">Nama lengkap</label><input id="person-name" value="${esc(p?.name||'')}" required maxlength="100"></div><div class="form-grid"><div><label for="person-birth">Tanggal lahir</label><input id="person-birth" type="date" value="${p?.birth||''}" required max="2026-10-27"></div><div><label for="person-gender">Kategori peserta</label><select id="person-gender">${['Putra','Putri'].map(g=>option(g,g,g===p?.gender)).join('')}</select></div></div><fieldset class="fieldset"><legend>Cabang yang diikuti</legend>${branches.map((b,i)=>`<label class="checkline" for="entry-${i}"><input id="entry-${i}" name="entry" type="checkbox" value="${i}" ${p?.entries.includes(i)?'checked':''}>${esc(b)}</label>`).join('')}</fieldset><p class="hint">Kafilah ${esc(district)}. Pilih minimal satu cabang; data terverifikasi akan dikunci.</p><div id="person-error" role="alert"></div><div class="actions dialog-actions">${button('Batal','closeDialog()')}<button class="btn primary" type="submit">Simpan data</button></div></form>`);}
function savePerson(event,id){event.preventDefault();if(role!=='district')return;const entries=[...document.querySelectorAll('[name=entry]:checked')].map(x=>+x.value);const name=$('person-name').value.trim();if(!entries.length||!name){$('person-error').innerHTML='<div class="error">Isi nama peserta dan pilih minimal satu cabang.</div>';return;}const birth=$('person-birth').value,gender=$('person-gender').value;const old=id?personById(id):null;if(id&&(!old||!['Draf','Perlu perbaikan'].includes(old.status)))return;const p={id:id||String(Date.now()),name,birth,gender,d:district,entries,status:old?.status||'Draf',note:old?.note||''};if(transaction(next=>{const item=next.people.find(x=>x.id===id);if(item)Object.assign(item,p);else next.people.push(p);},'Data peserta disimpan: '+name)){closeDialog();render();notify('Data peserta disimpan. Ajukan verifikasi setelah data lengkap.');}}
function submitPerson(id){const p=personById(id);if(role!=='district'||!p||!['Draf','Perlu perbaikan'].includes(p.status))return;openDialog('Ajukan verifikasi',`<p>Ajukan <strong>${esc(p.name)}</strong> kepada admin utama? Data tidak dapat diubah selama diperiksa.</p><div class="actions dialog-actions">${button('Kembali','closeDialog()')}${button('Ajukan peserta',`confirmSubmit('${id}')`,'primary')}</div>`);}
function confirmSubmit(id){const p=personById(id);if(role!=='district'||!p)return;if(transaction(next=>Object.assign(next.people.find(x=>x.id===id),{status:'Diajukan',note:''}),'Pengajuan verifikasi: '+p.name)){closeDialog();render();notify('Pengajuan dikirim ke admin utama.');}}
function personDetail(id){const p=personById(id);if(!p)return;openDialog(role==='admin'&&p.status==='Diajukan'?'Periksa pendaftaran':'Detail peserta',`<dl class="review"><div><dt>Nama peserta</dt><dd>${esc(p.name)}</dd></div><div><dt>Nomor / kecamatan</dt><dd>${esc(p.id)} · ${esc(p.d)}</dd></div><div><dt>Tanggal lahir / kategori</dt><dd>${esc(p.birth)} · ${p.gender}</dd></div><div><dt>Cabang</dt><dd>${p.entries.map(i=>esc(branches[i])).join('<br>')}</dd></div><div><dt>Status</dt><dd>${badge(p.status)}</dd></div></dl>${p.note?`<div class="notice warn" style="margin-top:20px">${esc(p.note)}</div>`:''}<div class="actions dialog-actions">${role==='admin'&&p.status==='Diajukan'?button('Kembalikan untuk perbaikan',`revisionForm('${id}')`)+button('Verifikasi & kunci',`verifyPerson('${id}')`,'primary'):button('Selesai','closeDialog()')}</div>`);}
function verifyPerson(id){const p=personById(id);if(role!=='admin'||p?.status!=='Diajukan')return;if(transaction(next=>Object.assign(next.people.find(x=>x.id===id),{status:'Terverifikasi',note:''}),'Peserta diverifikasi: '+p.name)){closeDialog();render();notify('Peserta terverifikasi dan siap mengikuti sesi.');}}
function revisionForm(id){if(role!=='admin')return;openDialog('Catatan perbaikan',`<form onsubmit="sendRevision(event,'${id}')" class="form-stack"><div><label for="revision-note">Data yang perlu diperbaiki</label><input id="revision-note" required maxlength="250" placeholder="Contoh: periksa tanggal lahir peserta"></div><p class="hint">Catatan akan tampil pada akun kecamatan.</p><div class="actions dialog-actions">${button('Kembali',`personDetail('${id}')`)}<button class="btn primary">Kirim catatan</button></div></form>`);}
function sendRevision(event,id){event.preventDefault();const p=personById(id),note=$('revision-note').value.trim();if(role!=='admin'||!p||!note)return;if(transaction(next=>Object.assign(next.people.find(x=>x.id===id),{status:'Perlu perbaikan',note}),'Pendaftaran dikembalikan: '+p.name)){closeDialog();render();notify('Catatan perbaikan disimpan.');}}
function accountsPage(){if(role!=='admin')return;$('view').innerHTML=`<section class="panel data-panel"><table class="table"><thead><tr><th>Kecamatan</th><th>Akun</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${db.accounts.map((a,i)=>`<tr><td data-label="Peserta"><strong>${esc(a.d)}</strong></td><td data-label="Username">${esc(a.user)}</td><td data-label="Status">${badge(a.active?'Aktif':'Nonaktif')}</td><td data-label="Tindakan"><div class="actions">${button(a.active?'Nonaktifkan':'Aktifkan',`toggleAccount(${i})`)}${button('Reset akses',`resetAccessForm(${i})`)}</div></td></tr>`).join('')}</tbody></table></section>`;}
function toggleAccount(i){if(role!=='admin')return;const a=db.accounts[i];if(transaction(next=>next.accounts[i].active=!a.active,(a.active?'Akun dinonaktifkan: ':'Akun diaktifkan: ')+a.d)){render();notify('Status akun diperbarui.');}}
function resetAccessForm(i){if(role!=='admin')return;openDialog('Reset akses demo',`<p>Kata sandi akun <strong>${esc(db.accounts[i].d)}</strong> akan kembali menjadi <code>demo123</code>.</p><div class="actions dialog-actions">${button('Batal','closeDialog()')}${button('Reset kata sandi',`resetAccess(${i})`,'primary')}</div>`);}
function resetAccess(i){if(role!=='admin')return;if(transaction(next=>next.accounts[i].password='demo123','Kata sandi demo direset: '+db.accounts[i].d)){closeDialog();notify('Kata sandi demo menjadi demo123.');}}
function accountDialog(){openDialog('Pengaturan akun',`<p><strong>${role==='admin'?'Admin utama':'Kafilah '+esc(district)}</strong><br>Akses demonstrasi pada browser ini.</p><div class="stack">${button('Ubah kata sandi demo','passwordForm()')}${button(theme==='dark'?'Gunakan tema terang':'Gunakan tema gelap','setTheme();accountDialog()')}${button('Keluar dari akun','logout()')}</div>`);}
function passwordForm(){openDialog('Ubah kata sandi demo',`<form onsubmit="changePassword(event)" class="form-stack"><div><label for="current-password">Kata sandi saat ini</label><input id="current-password" type="password" autocomplete="current-password" required></div><div><label for="new-password">Kata sandi baru</label><input id="new-password" type="password" autocomplete="new-password" minlength="6" required aria-describedby="password-hint"><p class="hint" id="password-hint">Minimal 6 karakter. Gunakan kata sandi khusus demo.</p></div><div id="password-error" role="alert"></div><div class="actions dialog-actions">${button('Batal','closeDialog()')}<button class="btn primary">Simpan kata sandi</button></div></form>`);}
function changePassword(event){event.preventDefault();const current=$('current-password').value,value=$('new-password').value,account=db.accounts.find(a=>a.d===district);if(current!==(role==='admin'?db.adminPassword:account.password)){$('password-error').innerHTML='<div class="error">Kata sandi saat ini tidak sesuai.</div>';return;}if(value.length<6)return;if(transaction(next=>{if(role==='admin')next.adminPassword=value;else next.accounts.find(a=>a.d===district).password=value;},'Kata sandi demo diubah: '+(role==='admin'?'Admin utama':district))){closeDialog();notify('Kata sandi demo berhasil diperbarui.');}}
function sessionsPage(){if(role!=='admin')return;$('view').innerHTML=`<div class="notice" style="margin-bottom:24px">Sesi dibuka per cabang dan babak. Hanya peserta terverifikasi yang dapat mengundi.</div><section class="panel">${db.sessions.map((s,i)=>`<form class="session-row" onsubmit="saveSession(event,${i})"><div><h2>${esc(branches[s.branch])}</h2><p>${db.bank.filter(m=>m.branch===s.branch).length} paket contoh</p>${badge(s.open?'Dibuka':'Menunggu sesi')}</div><div><label for="round-${i}">Babak</label><select id="round-${i}">${['Penyisihan','Final'].map(r=>option(r,r,s.round===r)).join('')}</select></div><div><label for="repeat-${i}">Ketentuan paket</label><select id="repeat-${i}">${option('yes','Boleh terpilih kembali',s.repeat)}${option('no','Unik per cabang & babak',!s.repeat)}</select></div><div class="actions"><button class="btn" type="submit">Simpan</button>${button(s.open?'Tutup sesi':'Buka sesi',`toggleSession(${i})`,s.open?'':'primary')}</div></form>`).join('')}</section>`;}
function saveSession(event,i){event.preventDefault();if(role!=='admin')return;const round=$('round-'+i).value,repeat=$('repeat-'+i).value==='yes';if(transaction(next=>{next.sessions[i].round=round;next.sessions[i].repeat=repeat;},'Pengaturan sesi disimpan: '+branches[i]+' / '+round)){render();notify('Pengaturan sesi disimpan.');}}
function toggleSession(i){if(role!=='admin')return;const s=db.sessions[i];if(!s.open&&!db.bank.some(m=>m.branch===i)){notify('Tambahkan paket maqro sebelum membuka sesi.');return;}if(transaction(next=>next.sessions[i].open=!s.open,(s.open?'Sesi ditutup: ':'Sesi dibuka: ')+branches[i]+' / '+s.round)){render();notify(s.open?'Sesi ditutup.':'Sesi dibuka untuk kecamatan.');}}
function bankPage(){if(role!=='admin')return;$('view').innerHTML=`<div class="cardgrid">${branches.map((b,i)=>`<section class="panel"><h2>${esc(b)}</h2><p class="hint" style="margin-bottom:20px">${db.bank.filter(m=>m.branch===i).length} paket contoh</p>${db.bank.filter(m=>m.branch===i).map(m=>`<article class="bank-item"><h3>${esc(m.id)}</h3><p>QS. ${esc(m.surah)}<br>Ayat ${esc(m.verses)}</p></article>`).join('')||empty('Belum ada paket','Tambahkan paket sebelum membuka sesi cabang ini.')}</section>`).join('')}</div>`;}
function maqroForm(){if(role!=='admin')return;openDialog('Tambah paket maqro',`<form class="form-stack" onsubmit="saveMaqro(event)"><div><label for="maqro-branch">Cabang</label><select id="maqro-branch">${branches.map((b,i)=>option(i,b)).join('')}</select></div><div><label for="maqro-surah">Nama surah</label><input id="maqro-surah" required maxlength="100" placeholder="Nama surah sesuai paket panitia"></div><div><label for="maqro-verses">Rentang ayat</label><input id="maqro-verses" required maxlength="50" placeholder="Contoh: 12–19"></div><div class="actions dialog-actions">${button('Batal','closeDialog()')}<button class="btn primary">Simpan paket</button></div></form>`);}
function saveMaqro(event){event.preventDefault();if(role!=='admin')return;const branch=+$('maqro-branch').value,surah=$('maqro-surah').value.trim(),verses=$('maqro-verses').value.trim();if(!surah||!verses)return;const id='M'+(branch+1)+'-'+Date.now().toString().slice(-6);if(transaction(next=>next.bank.push({id,branch,surah,verses}),'Paket maqro ditambahkan: '+id)){closeDialog();render();notify('Paket maqro disimpan.');}}
function stepper(){return `<ol class="stepper" aria-label="Langkah undian">${['Pilih peserta','Konfirmasi','Tetapkan maqro','Bukti hasil'].map((s,i)=>`<li ${drawStep===i+1?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${s}</li>`).join('')}</ol>`;}
function drawPage(){if(role!=='district')return;$('view').innerHTML=`<div class="draw-layout">${stepper()}<div class="draw-context"><span>Kafilah <strong>${esc(district)}</strong></span><span>Hasil tersimpan per peserta, cabang, dan babak</span></div><div id="draw-content" aria-live="polite"></div></div>`;if(drawStep===1)drawList();else if(drawStep===2)drawReview();else if(drawStep===3)drawProcessing();else if(drawResult)drawReceipt();}
function drawList(){const entries=visiblePeople().filter(p=>p.status==='Terverifikasi').flatMap(p=>p.entries.map(b=>({p,b,s:db.sessions[b]})));$('draw-content').innerHTML=`<section class="panel data-panel">${entries.length?`<table class="table"><thead><tr><th>Peserta</th><th>Cabang / babak</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${entries.map(({p,b,s})=>{const result=resultFor(p.id,b,s.round);return `<tr><td data-label="Peserta"><div><strong>${esc(p.name)}</strong><small>No. ${esc(p.id)}</small></div></td><td data-label="Cabang"><div>${esc(branches[b])}<small>${s.round}</small></div></td><td data-label="Status">${badge(result?'Sudah diundi':s.open?'Siap diundi':'Menunggu sesi')}</td><td data-label="Tindakan"><div>${result?button('Lihat hasil',`openResult('${result.id}',true)`):s.open?button('Pilih peserta',`selectDraw('${p.id}',${b})`,'primary'):'<small>Menunggu admin membuka sesi.</small>'}</div></td></tr>`;}).join('')}</tbody></table>`:`<div style="padding:20px">${empty('Belum ada peserta siap undian','Peserta harus terverifikasi lebih dahulu. Periksa status pendaftaran dan catatan perbaikan.',button('Periksa peserta',"go('people')",'primary'))}</div>`}</section>`;}
function selectDraw(id,branch){const p=personById(id),s=db.sessions[branch];if(!p||p.status!=='Terverifikasi'||!s.open||!p.entries.includes(branch))return;const existing=resultFor(id,branch,s.round);if(existing)return openResult(existing.id,true);drawSelection={pid:id,branch,round:s.round};drawStep=2;drawPage();$('draw-content').scrollIntoView({block:'nearest'});}
function drawReview(){const p=personById(drawSelection?.pid),s=drawSelection;if(!p||!s){drawStep=1;drawPage();return;}$('draw-content').innerHTML=`<section class="panel"><h2>Periksa identitas peserta</h2><p>Hasil langsung disimpan setelah Anda menekan Tetapkan maqro.</p><dl class="review"><div><dt>Nama peserta</dt><dd>${esc(p.name)}</dd></div><div><dt>Nomor peserta</dt><dd>${esc(p.id)}</dd></div><div><dt>Kecamatan</dt><dd>${esc(p.d)}</dd></div><div><dt>Cabang / babak</dt><dd>${esc(branches[s.branch])} · ${s.round}</dd></div></dl><div class="notice" style="margin-top:22px">Satu hasil berlaku untuk peserta, cabang, dan babak ini. Kecamatan tidak dapat mengulang hasil yang sudah tersimpan.</div><div id="draw-error" role="alert"></div><div class="draw-action">${button('Kembali ke peserta','backDraw()')}${button('Tetapkan maqro','startDraw()','primary')}</div></section>`;}
function backDraw(){if(busy)return;drawStep=1;drawSelection=null;drawPage();}
function drawProcessing(){$('draw-content').innerHTML=`<section class="panel drawing" aria-busy="true"><h2>Menyimpan hasil undian</h2><p>Identitas peserta dan paket maqro sedang dicatat.</p><div class="loading-bar" aria-hidden="true"></div><p class="hint">Halaman hasil akan tampil setelah penyimpanan berhasil.</p></section>`;}
function startDraw(){if(busy||role!=='district'||!drawSelection)return;const selection={...drawSelection},p=personById(selection.pid),s=db.sessions[selection.branch];const existing=resultFor(selection.pid,selection.branch,selection.round);if(existing)return openResult(existing.id,true);if(!p||p.status!=='Terverifikasi'||!s.open||s.round!==selection.round){$('draw-error').innerHTML='<div class="error">Sesi atau status peserta berubah. Kembali ke daftar untuk memeriksa.</div>';return;}const pool=db.bank.filter(m=>m.branch===selection.branch&&(s.repeat||!db.results.some(r=>r.branch===selection.branch&&r.round===selection.round&&r.package===m.id&&!r.cancelled)));if(!pool.length){$('draw-error').innerHTML='<div class="error">Paket maqro untuk sesi ini sudah habis. Hubungi admin utama untuk menambah paket atau mengubah ketentuan.</div>';return;}const n=new Uint32Array(1),limit=2**32-((2**32)%pool.length);do{crypto.getRandomValues(n);}while(n[0]>=limit);const m=pool[n[0]%pool.length];const result={id:'UND-'+Date.now()+'-'+n[0].toString(16).slice(-4),pid:p.id,name:p.name,d:p.d,branch:selection.branch,round:selection.round,package:m.id,surah:m.surah,verses:m.verses,time:new Date().toLocaleString('id-ID',{timeZone:'Asia/Makassar'}),cancelled:false};busy=true;drawStep=3;drawPage();setTimeout(()=>{const candidate=structuredClone(db);candidate.results.push(result);candidate.logs.unshift({t:'Undian tersimpan: '+p.name+' / '+branches[result.branch],time:result.time});try{localStorage.setItem(KEY,JSON.stringify(candidate));db=candidate;busy=false;saveFailure='';drawStep=4;drawResult=result;drawPage();}catch{busy=false;drawStep=2;drawPage();$('draw-error').innerHTML='<div class="error">Hasil belum ditetapkan karena penyimpanan gagal. Periksa izin atau ruang penyimpanan browser, lalu tekan Tetapkan maqro untuk mencoba lagi.</div>';}} ,120);}
function receiptMarkup(r){return `<article class="receipt"><div class="receipt-head"><div><h2>Bukti undian maqro</h2><p>MTQ Kabupaten Kutai Barat · 2026<br>Data contoh untuk peninjauan</p></div><div>${badge(r.cancelled?'Dibatalkan':'Tersimpan')}</div></div><div class="maqro-result"><span class="muted">Paket maqro</span><div class="package-code">${esc(r.package)}</div><h2>QS. ${esc(r.surah)}</h2><p>Ayat ${esc(r.verses)}</p></div><dl class="review"><div><dt>Nama peserta</dt><dd>${esc(r.name)}</dd></div><div><dt>Nomor / kecamatan</dt><dd>${esc(r.pid)} · ${esc(r.d)}</dd></div><div><dt>Cabang / babak</dt><dd>${esc(branches[r.branch])} · ${r.round}</dd></div><div><dt>Waktu undian</dt><dd>${esc(r.time)} WITA</dd></div></dl>${r.cancelled?`<div class="notice warn" style="margin-top:20px">Dibatalkan oleh admin. Alasan: ${esc(r.reason)}</div>`:''}<div class="receipt-foot">Nomor bukti: ${esc(r.id)}<br>Salinan demo dari catatan pada perangkat ini.</div></article>`;}
function drawReceipt(){$('draw-content').innerHTML=receiptMarkup(drawResult)+`<div class="actions receipt-actions">${button('Kembali ke daftar peserta','backDraw()')}${button('Cetak / Simpan PDF','printReceipt(false)','primary')}</div>`;}
function openResult(id,inline=false){const r=visibleResults().find(x=>x.id===id);if(!r)return;if(inline){page='draw';drawStep=4;drawResult=r;render();}else openDialog('Bukti hasil undian',receiptMarkup(r)+`<div class="actions dialog-actions">${button('Selesai','closeDialog()')}${button('Cetak / Simpan PDF','printReceipt(true)','primary')}</div>`);}
function printReceipt(inDialog){document.body.classList.toggle('print-dialog',inDialog);window.print();}
function resultsPage(){const rs=visibleResults();$('view').innerHTML=`<section class="panel data-panel"><div class="section-head"><div><h2>Register hasil</h2><p class="hint">${rs.length} catatan · hasil dibatalkan tetap tersimpan</p></div>${button('Ekspor CSV','exportCSV()','',rs.length?'':'disabled')}</div>${rs.length?`<table class="table"><thead><tr><th>Peserta</th><th>Cabang / babak</th><th>Paket maqro</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>${[...rs].reverse().map(r=>`<tr><td data-label="Peserta"><div><strong>${esc(r.name)}</strong><small>${esc(r.d)} · No. ${esc(r.pid)}</small></div></td><td data-label="Cabang"><div>${esc(branches[r.branch])}<small>${r.round}</small></div></td><td data-label="Maqro"><div>${esc(r.package)}<small>${esc(r.surah)} · ${esc(r.verses)}</small></div></td><td data-label="Status">${badge(r.cancelled?'Dibatalkan':'Tersimpan')}</td><td data-label="Tindakan"><div class="actions">${button('Bukti hasil',`openResult('${r.id}')`)}${role==='admin'&&!r.cancelled?button('Batalkan',`cancelForm('${r.id}')`,'danger'):''}</div></td></tr>`).join('')}</tbody></table>`:`<div style="padding:0 20px 20px">${empty('Belum ada hasil undian',role==='admin'?'Hasil akan muncul setelah kecamatan menyelesaikan undian pada sesi yang dibuka.':'Lakukan undian untuk peserta terverifikasi pada sesi yang dibuka panitia.',button(role==='admin'?'Periksa sesi':'Buka ruang undian',`go('${role==='admin'?'sessions':'draw'}')`,'primary'))}</div>`}</section>`;}
function cancelForm(id){if(role!=='admin')return;const r=visibleResults().find(x=>x.id===id);if(!r||r.cancelled)return;openDialog('Batalkan hasil undian',`<p><strong>${esc(r.name)}</strong> · ${esc(r.package)}<br>Hasil lama tetap tercatat. Undian pengganti dapat dilakukan jika sesi dibuka.</p><form onsubmit="cancelResult(event,'${id}')" class="form-stack"><div><label for="cancel-reason">Alasan pembatalan</label><input id="cancel-reason" required maxlength="250"></div><div class="actions dialog-actions">${button('Kembali','closeDialog()')}<button class="btn danger">Batalkan hasil</button></div></form>`);}
function cancelResult(event,id){event.preventDefault();if(role!=='admin')return;const reason=$('cancel-reason').value.trim();if(!reason)return;if(transaction(next=>Object.assign(next.results.find(r=>r.id===id),{cancelled:true,reason,cancelledBy:'Admin utama'}),'Pembatalan '+id+': '+reason)){closeDialog();render();notify('Hasil dibatalkan. Catatan lama dipertahankan.');}}
function exportCSV(){const rows=visibleResults();if(!rows.length)return;const data=[['Nomor bukti','Peserta','Kecamatan','Cabang','Babak','Paket','Surah','Ayat','Waktu WITA','Status','Alasan'],...rows.map(r=>[r.id,r.name,r.d,branches[r.branch],r.round,r.package,r.surah,r.verses,r.time,r.cancelled?'Dibatalkan':'Tersimpan',r.reason||''])];const cell=value=>{let text=String(value);if(/^[=+@\-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};const url=URL.createObjectURL(new Blob(['\ufeff'+data.map(row=>row.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='register-undian-maqro.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Rekap CSV diunduh.');}
function logsPage(){$('view').innerHTML=`<section class="panel"><h2>Jejak keputusan panitia</h2>${db.logs.length?db.logs.map(l=>`<div class="log-item">${esc(l.t)}<small>${esc(l.time)} WITA</small></div>`).join(''):empty('Belum ada perubahan','Pengajuan, verifikasi, pengaturan sesi, dan hasil undian akan tercatat setelah dilakukan.')}</section>`;}
login();

</script></body></html>
